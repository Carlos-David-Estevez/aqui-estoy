<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aquí estoy</title>
<meta name="description" content="Un rincón con tu voz, para cuando cuesta dormir.">
<meta name="theme-color" content="#0b1220">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1220;
  --card:#141e30;
  --card-hover:#1a2740;
  --card-active-border: rgba(232,185,120,.55);
  --accent:#e8b978;
  --accent-soft: rgba(232,185,120,.16);
  --lavender:#9fb0d9;
  --text:#eef1f7;
  --text-dim:#8f9bb5;
  --border: rgba(159,176,217,.14);
  --radius: 20px;
  --font-display: 'Fraunces', serif;
  --font-body: 'Work Sans', sans-serif;
}

*{box-sizing:border-box;}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  background:
    radial-gradient(ellipse 900px 500px at 50% -10%, #182644 0%, transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

.stars{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
}
.star{
  position:absolute;
  width:2px;
  height:2px;
  border-radius:50%;
  background:var(--lavender);
  opacity:.5;
  animation:twinkle 4s ease-in-out infinite;
}
@keyframes twinkle{
  0%,100%{opacity:.15;}
  50%{opacity:.7;}
}

.orb{
  position:fixed;
  top:-10vh;
  left:50%;
  transform:translateX(-50%);
  width:min(640px, 80vw);
  aspect-ratio:1;
  border-radius:50%;
  background:radial-gradient(circle, var(--accent-soft) 0%, transparent 70%);
  filter:blur(30px);
  animation:breathe 11s ease-in-out infinite alternate;
  z-index:0;
  pointer-events:none;
}
@keyframes breathe{
  from{transform:translateX(-50%) scale(1); opacity:.55;}
  to{transform:translateX(-50%) scale(1.14); opacity:.9;}
}

main{
  position:relative;
  z-index:1;
  max-width:640px;
  margin:0 auto;
  padding:11vh 24px 8vh;
}

.intro{
  text-align:center;
  margin-bottom:52px;
}
.eyebrow{
  font-size:13px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--accent);
  margin:0 0 14px;
  font-weight:500;
}
h1{
  font-family:var(--font-display);
  font-weight:500;
  font-size:clamp(38px, 7vw, 54px);
  margin:0 0 12px;
  letter-spacing:-.01em;
}
.subtitle{
  color:var(--text-dim);
  font-size:16px;
  margin:0;
}

.moments{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
@media (max-width:520px){
  .moments{grid-template-columns:1fr;}
}

.moment-card{
  text-align:left;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:22px 20px;
  color:var(--text);
  cursor:pointer;
  display:flex;
  flex-direction:column;
  gap:10px;
  transition:background .2s ease, border-color .2s ease, transform .2s ease;
  font-family:inherit;
}
.moment-card:hover{
  background:var(--card-hover);
  transform:translateY(-2px);
}
.moment-card:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:3px;
}
.moment-icon{
  width:26px;
  height:26px;
  color:var(--accent);
}
.moment-label{
  font-family:var(--font-display);
  font-size:19px;
  font-weight:500;
}
.moment-desc{
  font-size:13.5px;
  color:var(--text-dim);
  line-height:1.5;
}

.player{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:32px 28px;
}
.back{
  background:none;
  border:none;
  color:var(--text-dim);
  font-family:inherit;
  font-size:13.5px;
  cursor:pointer;
  padding:0 0 22px;
}
.back:hover{color:var(--accent);}

.player h2{
  font-family:var(--font-display);
  font-weight:500;
  font-size:28px;
  margin:0 0 8px;
}
.player-desc{
  color:var(--text-dim);
  font-size:14.5px;
  margin:0 0 30px;
}

.player-controls{
  display:flex;
  align-items:center;
  gap:20px;
  margin-bottom:26px;
}
.play-btn{
  flex:none;
  width:58px;
  height:58px;
  border-radius:50%;
  border:1px solid var(--card-active-border);
  background:var(--accent-soft);
  color:var(--accent);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:background .2s ease, transform .15s ease;
}
.play-btn:hover{background:rgba(232,185,120,.26);}
.play-btn:active{transform:scale(.94);}
.play-btn svg{width:22px;height:22px;}
.play-btn:focus-visible{outline:2px solid var(--accent); outline-offset:3px;}

.progress-wrap{flex:1;}
.progress-bar{
  height:6px;
  border-radius:3px;
  background:rgba(159,176,217,.15);
  cursor:pointer;
  position:relative;
}
.progress-fill{
  height:100%;
  width:0%;
  border-radius:3px;
  background:var(--accent);
}
.time-row{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:var(--text-dim);
  margin-top:8px;
  font-variant-numeric:tabular-nums;
}

.secondary-controls{
  display:flex;
  flex-wrap:wrap;
  gap:24px;
  border-top:1px solid var(--border);
  padding-top:22px;
}
.control{
  display:flex;
  flex-direction:column;
  gap:8px;
  font-size:13px;
  color:var(--text-dim);
  flex:1;
  min-width:150px;
}
.control input[type="range"]{
  accent-color:var(--accent);
}
.control select{
  background:var(--bg);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:8px;
  padding:8px 10px;
  font-family:inherit;
  font-size:13.5px;
}

.timer-status{
  margin:18px 0 0;
  font-size:12.5px;
  color:var(--accent);
}

.missing{
  margin:22px 0 0;
  padding:14px 16px;
  border-radius:12px;
  background:rgba(232,185,120,.08);
  border:1px dashed var(--card-active-border);
  color:var(--text-dim);
  font-size:13px;
  line-height:1.6;
}
.missing code{
  color:var(--accent);
}

.foot{
  text-align:center;
  margin-top:54px;
  color:var(--text-dim);
  font-size:12px;
  letter-spacing:.04em;
}

@media (prefers-reduced-motion: reduce){
  .orb, .star{animation:none !important;}
}

</style>
</head>
<body>

<div class="stars" id="stars" aria-hidden="true"></div>
<div class="orb" aria-hidden="true"></div>

<main>

  <header class="intro">
    <p class="eyebrow">Para ti, esta noche</p>
    <h1>Aquí estoy</h1>
    <p class="subtitle">Toca según cómo te sientas ahora mismo</p>
  </header>

  <section class="moments" id="moments" aria-label="Cómo te sientes ahora">

    <button class="moment-card" data-moment="agobio" aria-pressed="false">
      <svg class="moment-icon" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <path d="M20 8c-6 0-10 4.5-10 10 0 3 1.5 5.5 3.8 7.2-.6 1.4-1.6 2.4-1.6 2.4s2.4.2 4.3-1.1c1.1.4 2.3.6 3.5.6 6 0 10-4.5 10-10S26 8 20 8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M15 19c1-1.5 2.5-1.5 3.5 0M21.5 19c1-1.5 2.5-1.5 3.5 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span class="moment-label">No paro de pensar</span>
      <span class="moment-desc">Cuando la cabeza no se calla y sientes que no vas a poder dormir.</span>
    </button>

    <button class="moment-card" data-moment="ruido" aria-pressed="false">
      <svg class="moment-icon" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <path d="M8 20c0-1.5 1-2.5 2.5-2.5S13 18.5 13 20s-1 2.5-2.5 2.5S8 21.5 8 20Z" stroke="currentColor" stroke-width="1.6"/>
        <path d="M16 14v12M20 10v20M24 15v10M28 17v6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span class="moment-label">Algo me ha sobresaltado</span>
      <span class="moment-desc">Un ruido, un pensamiento raro, algo que te ha desvelado de golpe.</span>
    </button>

    <button class="moment-card" data-moment="tarde" aria-pressed="false">
      <svg class="moment-icon" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <circle cx="20" cy="20" r="11" stroke="currentColor" stroke-width="1.6"/>
        <path d="M20 13v7l5 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="moment-label">He mirado la hora</span>
      <span class="moment-desc">Ves que es tarde y eso te agobia todavía más.</span>
    </button>

    <button class="moment-card" data-moment="general" aria-pressed="false">
      <svg class="moment-icon" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <path d="M20 28s-8.5-5.2-8.5-11.4c0-3.3 2.6-5.6 5.5-5.6 1.7 0 3.3.9 3.9 2.3.6-1.4 2.2-2.3 3.9-2.3 2.9 0 5.5 2.3 5.5 5.6C30.3 22.8 20 28 20 28Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      <span class="moment-label">Solo quiero oírte</span>
      <span class="moment-desc">Sin motivo concreto. Solo necesitas mi voz un rato.</span>
    </button>

  </section>

  <section class="player" id="player" hidden>
    <button class="back" id="backBtn">← Elegir otro momento</button>

    <h2 id="playerTitle"></h2>
    <p class="player-desc" id="playerDesc"></p>

    <div class="player-controls">
      <button class="play-btn" id="playPauseBtn" aria-label="Reproducir">
        <svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7L8 5Z"/></svg>
        <svg id="iconPause" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M7 5h4v14H7V5Zm6 0h4v14h-4V5Z"/></svg>
      </button>

      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="time-row">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>
    </div>

    <div class="secondary-controls">
      <label class="control">
        <span>Volumen</span>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.85">
      </label>
      <label class="control">
        <span>Apagar solo en</span>
        <select id="sleepTimer">
          <option value="0">No, déjalo sonar</option>
          <option value="15">15 minutos</option>
          <option value="30" selected>30 minutos</option>
          <option value="45">45 minutos</option>
          <option value="60">60 minutos</option>
        </select>
      </label>
    </div>

    <p class="timer-status" id="timerStatus" hidden></p>

    <p class="missing" id="missingAudio" hidden>
      Todavía no hay un audio subido para este momento.<br>
      Añádelo en <code>/audios/</code> con el nombre indicado en el <code>README</code>.
    </p>

    <audio id="audioEl" preload="none"></audio>
  </section>

  <footer class="foot">
    <p>hecho para ti · buenas noches</p>
  </footer>

</main>

<script>
// ---------------------------------------------------------------
// Configuración de los "momentos". Cada uno puede tener varios
// audios: si hay más de uno, se elige uno al azar cada vez.
// Para añadir más audios a un momento, simplemente añade otra
// ruta al array "tracks". Los nombres deben coincidir con los
// archivos reales dentro de la carpeta /audios/.
// ---------------------------------------------------------------
const MOMENTS = {
  agobio: {
    title: "No paro de pensar",
    desc: "Respira. Aquí tienes mi voz, solo para ti.",
    tracks: ["audios/agobiada-1.mp3"],
    loop: true,
  },
  ruido: {
    title: "Algo me ha sobresaltado",
    desc: "Tranquila, no pasa nada. Escúchame un momento.",
    tracks: ["audios/ruido-1.mp3"],
    loop: false,
  },
  tarde: {
    title: "He mirado la hora",
    desc: "Da igual la hora que sea. Vamos a descansar.",
    tracks: ["audios/tarde-1.mp3"],
    loop: true,
  },
  general: {
    title: "Solo quiero oírte",
    desc: "Aquí estoy, quédate escuchando lo que necesites.",
    tracks: ["audios/generico-1.mp3"],
    loop: true,
  },
};

// ---------------------------------------------------------------
// Estrellas de fondo
// ---------------------------------------------------------------
(function createStars() {
  const container = document.getElementById("stars");
  const count = window.innerWidth < 520 ? 26 : 46;
  for (let i = 0; i < count; i++) {
    const s = document.createElement("div");
    s.className = "star";
    s.style.top = Math.random() * 70 + "%";
    s.style.left = Math.random() * 100 + "%";
    s.style.animationDelay = (Math.random() * 4).toFixed(2) + "s";
    const size = (Math.random() * 1.5 + 1).toFixed(1);
    s.style.width = size + "px";
    s.style.height = size + "px";
    container.appendChild(s);
  }
})();

// ---------------------------------------------------------------
// Elementos
// ---------------------------------------------------------------
const momentsSection = document.getElementById("moments");
const playerSection = document.getElementById("player");
const backBtn = document.getElementById("backBtn");
const playerTitle = document.getElementById("playerTitle");
const playerDesc = document.getElementById("playerDesc");
const playPauseBtn = document.getElementById("playPauseBtn");
const iconPlay = document.getElementById("iconPlay");
const iconPause = document.getElementById("iconPause");
const progressBar = document.getElementById("progressBar");
const progressFill = document.getElementById("progressFill");
const currentTimeEl = document.getElementById("currentTime");
const durationEl = document.getElementById("duration");
const volumeInput = document.getElementById("volume");
const sleepTimerSelect = document.getElementById("sleepTimer");
const timerStatus = document.getElementById("timerStatus");
const missingAudio = document.getElementById("missingAudio");
const audioEl = document.getElementById("audioEl");

let sleepTimeoutId = null;
let fadeIntervalId = null;

function formatTime(sec) {
  if (!isFinite(sec)) return "0:00";
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2, "0");
  return `${m}:${s}`;
}

function clearSleepTimer() {
  if (sleepTimeoutId) clearTimeout(sleepTimeoutId);
  if (fadeIntervalId) clearInterval(fadeIntervalId);
  sleepTimeoutId = null;
  fadeIntervalId = null;
  timerStatus.hidden = true;
}

function armSleepTimer(minutes, targetVolume) {
  clearSleepTimer();
  if (!minutes || minutes === "0") return;
  const ms = parseInt(minutes, 10) * 60 * 1000;
  timerStatus.hidden = false;
  timerStatus.textContent = `Se apagará suavemente en ${minutes} minutos`;
  sleepTimeoutId = setTimeout(() => {
    timerStatus.textContent = "Bajando el volumen para que descanses…";
    const fadeSteps = 40;
    const fadeDuration = 8000;
    let step = 0;
    const startVol = audioEl.volume;
    fadeIntervalId = setInterval(() => {
      step++;
      audioEl.volume = Math.max(0, startVol * (1 - step / fadeSteps));
      if (step >= fadeSteps) {
        clearInterval(fadeIntervalId);
        audioEl.pause();
        audioEl.volume = targetVolume;
        timerStatus.textContent = "Buenas noches.";
      }
    }, fadeDuration / fadeSteps);
  }, ms);
}

function openMoment(key) {
  const moment = MOMENTS[key];
  if (!moment) return;

  clearSleepTimer();
  missingAudio.hidden = true;

  const track = moment.tracks[Math.floor(Math.random() * moment.tracks.length)];

  playerTitle.textContent = moment.title;
  playerDesc.textContent = moment.desc;
  audioEl.src = track;
  audioEl.loop = moment.loop;
  audioEl.volume = parseFloat(volumeInput.value);

  progressFill.style.width = "0%";
  currentTimeEl.textContent = "0:00";
  durationEl.textContent = "0:00";
  setPlayingIcon(false);

  momentsSection.hidden = true;
  playerSection.hidden = false;

  document.querySelectorAll(".moment-card").forEach((btn) => {
    btn.setAttribute("aria-pressed", btn.dataset.moment === key ? "true" : "false");
  });

  audioEl.play().then(() => {
    setPlayingIcon(true);
    armSleepTimer(sleepTimerSelect.value, parseFloat(volumeInput.value));
  }).catch(() => {
    // el navegador puede bloquear el autoplay; el botón de play sigue disponible
    setPlayingIcon(false);
  });
}

function setPlayingIcon(isPlaying) {
  iconPlay.hidden = isPlaying;
  iconPause.hidden = !isPlaying;
  playPauseBtn.setAttribute("aria-label", isPlaying ? "Pausar" : "Reproducir");
}

momentsSection.addEventListener("click", (e) => {
  const card = e.target.closest(".moment-card");
  if (card) openMoment(card.dataset.moment);
});

backBtn.addEventListener("click", () => {
  audioEl.pause();
  clearSleepTimer();
  playerSection.hidden = true;
  momentsSection.hidden = false;
});

playPauseBtn.addEventListener("click", () => {
  if (audioEl.paused) {
    audioEl.play().then(() => setPlayingIcon(true)).catch(() => {});
  } else {
    audioEl.pause();
    setPlayingIcon(false);
  }
});

audioEl.addEventListener("timeupdate", () => {
  if (!audioEl.duration) return;
  progressFill.style.width = (audioEl.currentTime / audioEl.duration) * 100 + "%";
  currentTimeEl.textContent = formatTime(audioEl.currentTime);
});

audioEl.addEventListener("loadedmetadata", () => {
  durationEl.textContent = formatTime(audioEl.duration);
});

audioEl.addEventListener("ended", () => {
  setPlayingIcon(false);
});

audioEl.addEventListener("error", () => {
  if (audioEl.currentSrc) missingAudio.hidden = false;
});

progressBar.addEventListener("click", (e) => {
  if (!audioEl.duration) return;
  const rect = progressBar.getBoundingClientRect();
  const ratio = (e.clientX - rect.left) / rect.width;
  audioEl.currentTime = ratio * audioEl.duration;
});

volumeInput.addEventListener("input", () => {
  audioEl.volume = parseFloat(volumeInput.value);
});

sleepTimerSelect.addEventListener("change", () => {
  if (!audioEl.paused) armSleepTimer(sleepTimerSelect.value, parseFloat(volumeInput.value));
});

</script>
</body>
</html>
